<section class="story-hud" aria-label="Estado narrativo de la mision">
  <div class="story-hud__main">
    <p class="story-hud__phase">{{ mission.kicker }}</p>
    <h2 class="story-hud__title">{{ mission.headline }}</h2>
    <p class="story-hud__prompt">{{ mission.mission_prompt }}</p>
  </div>
  <div class="story-hud__skill">{{ mission.skill }}</div>
</section>
